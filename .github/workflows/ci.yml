# What every pull request and every push to `main` must pass: the checks every plugin of
# SpelaionDB shares, kept in the template's repository and called by commit. A change there
# reaches this plugin when this file moves the commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    # DuckDB is compiled in: the type zoo and the conformance set need nothing external.
    uses: spelaion-dev/spelaiondb-plugin-template/.github/workflows/plugin-ci.yml@9714b4536df6674c2c9f3800a906aa8c7353eab3
